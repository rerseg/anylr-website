<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2B4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1E35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E8FE1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055A5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB830;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E08A00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="90" height="90" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- Top gold accent bar -->
  <rect width="90" height="3" rx="0" fill="#F5A623" opacity="0.9"/>

  <!-- Icon centred -->
  <g transform="translate(45,46)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="30" ry="35" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="23" ry="27" fill="none" stroke="#0077C8" stroke-width="1.2" opacity="0.4"/>
    <path d="M -32 15 C -42 -4, -25 -42, 4 -37 C 17 -34, 27 -25, 32 -12"
          fill="none" stroke="url(#swooshGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M -27 20 C -36 2, -21 -35, 3 -31 C 14 -28, 23 -21, 27 -10"
          fill="none" stroke="#FFB830" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="-11" y1="18" x2="0" y2="-16" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="11" y1="18" x2="0" y2="-16" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="-6" y1="5" x2="6" y2="5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Corner accents -->
  <path d="M 74 6 L 84 6 L 84 16" fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 6 84 L 6 74 L 16 74" fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
</svg>
