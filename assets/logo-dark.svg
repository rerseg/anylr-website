<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2B4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1E35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E8FE1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055A5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB830;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E08A00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="120" rx="8" ry="8" fill="url(#bgGrad)"/>
  <!-- Top gold bar -->
  <rect width="520" height="2.5" fill="#F5A623" opacity="0.95"/>

  <!-- Icon -->
  <g transform="translate(68,60)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="36" ry="42" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="28" ry="33" fill="none" stroke="#0077C8" stroke-width="1.5" opacity="0.4"/>
    <path d="M -38 18 C -50 -5, -30 -50, 5 -44 C 20 -41, 32 -30, 38 -14"
          fill="none" stroke="url(#swooshGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M -32 24 C -44 2, -26 -42, 4 -36 C 17 -33, 28 -24, 33 -10"
          fill="none" stroke="#FFB830" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    <line x1="-13" y1="22" x2="0" y2="-20" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="13" y1="22" x2="0" y2="-20" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="-7.5" y1="6" x2="7.5" y2="6" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Divider -->
  <line x1="124" y1="22" x2="124" y2="98" stroke="#F5A623" stroke-width="1.5" opacity="0.6"/>

  <!-- Text -->
  <g transform="translate(140,0)">
    <text x="0" y="62"
          font-family="'Trebuchet MS', 'Century Gothic', sans-serif"
          font-size="30" font-weight="700" letter-spacing="4" fill="white">ALL YOUR NEEDS</text>
    <rect x="0" y="68" width="340" height="2" rx="1" fill="#F5A623" opacity="0.7"/>
    <text x="2" y="88"
          font-family="'Trebuchet MS', 'Century Gothic', sans-serif"
          font-size="11.5" font-weight="400" letter-spacing="3.5" fill="#F5A623">WHERE NECESSITY MEETS INNOVATION</text>
  </g>

  <!-- Corner accents -->
  <path d="M 500 8 L 512 8 L 512 20" fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 8 112 L 8 100 L 20 100" fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
</svg>
